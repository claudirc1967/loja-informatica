<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Loja Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="brand-title">Loja de Informática</h1>
            <nav>
                <a href="index.html" class="nav-link">Loja</a>
                <a href="sobre.html" class="nav-link">Sobre</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-hero">
            <h2>Fale com a Loja Tech</h2>
            <p>Use o formulário abaixo para falar com nossa equipe comercial ou de suporte.</p>
        </section>

        <section class="page-section">
            <div class="page-card">
                <form id="contato-form" class="form-contato">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="4" required placeholder="Como podemos ajudar?"></textarea>
                    </div>
                    <button type="submit" class="btn-confirmar">
                        Enviar mensagem
                    </button>
                    <p id="contato-feedback" class="contato-feedback" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <script src="contato.js"></script>
</body>
</html>
